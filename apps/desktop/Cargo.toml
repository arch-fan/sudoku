[package]
name = "sudoku_desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "sudoku"
path = "src/main.rs"

[dependencies]
sudoku_ui.workspace = true
# runtime_shaders: compile Metal shaders at launch → no Metal toolchain needed at build time.
gpui_platform = { workspace = true, features = ["runtime_shaders"] }
