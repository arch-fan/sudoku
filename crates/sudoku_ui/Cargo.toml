[package]
name = "sudoku_ui"
description = "GPUI views for the Sudoku game, shared by every target (macOS, web, ...)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sudoku_core = { workspace = true, features = ["serde"] }
gpui.workspace = true
web-time.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs = "6"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Navigator", "Element", "HtmlElement", "HtmlMetaElement", "CssStyleDeclaration"] }
